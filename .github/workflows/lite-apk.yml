name: CutLab Lite APK

# CutLab Lite = the current browser-based editor (apps/web) wrapped with Capacitor.
# Whenever apps/web changes on main, GitHub builds the APK and keeps it as a private DRAFT release
# (visible only to the owner; never published).
# It stays the installable app until the Flutter edition reaches feature parity (see docs/ROADMAP.md).
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'android-signing/**'
      - '.github/workflows/lite-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.1.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar proyecto Capacitor
        run: |
          mkdir -p build/www
          cp apps/web/index.html apps/web/style.css apps/web/app.js apps/web/sw.js apps/web/manifest.webmanifest apps/web/icon-*.png build/www/
          cd build
          npm init -y >/dev/null
          npm install --no-audit --no-fund @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2 @capacitor/filesystem@6.0.1 @capacitor/share@6.0.2
          npx cap init CutLab com.lunaxoxone.cutlab --web-dir www
          npx cap add android
          npx cap sync android

      - name: Icono, versión y firma
        run: |
          cd build/android/app/src/main/res
          rm -rf mipmap-anydpi-v26
          for d in mipmap-*; do
            cp "$GITHUB_WORKSPACE/apps/web/icon-192.png" "$d/ic_launcher.png"
            cp "$GITHUB_WORKSPACE/apps/web/icon-192.png" "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
          cd "$GITHUB_WORKSPACE/build/android/app"
          sed -i "s/versionCode 1$/versionCode $VERSION_CODE/" build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" build.gradle
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/android-signing/cutlab.keystore" ~/.android/debug.keystore

      - name: Construir APK
        run: |
          cd build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CutLab.apk"

      - name: Guardar como release borrador privado
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-v${{ env.VERSION }}
          name: CutLab Lite v${{ env.VERSION }}
          draft: true
          make_latest: false
          files: CutLab.apk
          body: |
            ## CutLab — editor de vídeo estilo CapCut 🎬

            ### 📲 Instalar en Android
            1. Descarga **CutLab.apk** (abajo, en *Assets*).
            2. Ábrelo. Si Android lo pide, permite **instalar apps de origen desconocido** para tu navegador.
            3. Pulsa **Instalar**.

            Para actualizar, descarga el APK más nuevo e instálalo encima: tus proyectos se conservan.

            ### ✨ Funciones
            - Línea de tiempo con pistas de vídeo, texto y audio
            - Recortar, dividir, duplicar y reordenar clips
            - Velocidad 0.1x–4x y volumen hasta 200 %
            - 10 filtros, ajustes de color, 8 transiciones y efecto Ken Burns
            - Textos con plantillas, fuentes y animaciones
            - Música con fundidos
            - Formatos 9:16, 16:9, 1:1, 4:5 y 3:4
            - Exportación 480p / 720p / 1080p (se guarda en Documentos/CutLab)

            🔒 Todo se procesa en tu móvil. Tus vídeos nunca se suben a internet.
