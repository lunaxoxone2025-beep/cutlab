name: Flutter builds

# Builds the Flutter edition for Android and PC (Windows, Linux) and publishes
# the installable files as a new release per build, "cutlab-<version>"
# (personal use; earlier builds are never deleted).
#
# Platform folders are generated with `flutter create` at build time; custom
# native code lives in apps/cutlab/platform_overlay/ and is copied on top.
on:
  push:
    branches: [main]
    paths:
      - 'apps/cutlab/**'
      - 'packages/**'
      - 'core/**'
      - 'scripts/**'
      - 'android-signing/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

concurrency:
  group: flutter-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'
  # Distinct from CutLab Lite (com.lunaxoxone.cutlab) so both can be installed side by side.
  FLUTTER_ORG: com.lunaxoxone.studio
  BUILD_NAME: 0.6.${{ github.run_number }}

jobs:
  android:
    name: Android APK (arm64, with media engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Locate NDK
        id: ndk
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          VER=$(grep -m1 Pkg.Revision "$NDK/source.properties" | cut -d= -f2 | tr -d ' ')
          echo "home=$NDK" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "NDK $VER at $NDK"
      - id: ffcache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-android
          key: ffmpeg-codecs-android-arm64-${{ steps.ndk.outputs.version }}-${{ hashFiles('scripts/ffmpeg/build_ffmpeg.sh', 'scripts/ffmpeg/build_codecs.sh') }}
      - name: Build encoder libraries + FFmpeg for Android (static, LGPL, MediaCodec)
        if: steps.ffcache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
        run: |
          sudo apt-get update && sudo apt-get install -y nasm ninja-build
          WORK=$PWD/build/codecs scripts/ffmpeg/build_codecs.sh android-arm64 build/ffmpeg-android
          CODECS_PREFIX=$PWD/build/ffmpeg-android WORK=$PWD/build/ffwork scripts/ffmpeg/build_ffmpeg.sh android-arm64 build/ffmpeg-android
      - name: Build media engine (libcutlab_core.so)
        run: |
          NDK="${{ steps.ndk.outputs.home }}"
          cmake -S core -B build/core-android -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCUTLAB_WITH_MEDIA=ON -DCUTLAB_FFMPEG_ROOT=$PWD/build/ffmpeg-android -DCUTLAB_BUILD_TESTS=OFF
          cmake --build build/core-android -j 4
          # Keep the unstripped library: crash reports give offsets into it.
          mkdir -p symbols && cp build/core-android/libcutlab_core.so symbols/libcutlab_core-arm64-v8a.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded build/core-android/libcutlab_core.so
          ls -la build/core-android/libcutlab_core.so symbols/
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate platform folder + native overlay + engine
        working-directory: apps/cutlab
        run: |
          flutter create --platforms=android --org "$FLUTTER_ORG" --project-name cutlab .
          cp -R platform_overlay/android/. android/
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp "$GITHUB_WORKSPACE/build/core-android/libcutlab_core.so" android/app/src/main/jniLibs/arm64-v8a/
          # minSdk 24 (engine needs Android 7.0+) and the :hwprobe service.
          python3 ../../scripts/android/patch_android_project.py android
          grep -n "HwProbeService" android/app/src/main/AndroidManifest.xml
      - name: Use the fixed signing key (updates install over older builds)
        run: |
          mkdir -p ~/.android
          cp "$GITHUB_WORKSPACE/android-signing/cutlab.keystore" ~/.android/debug.keystore
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/cutlab/pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build APK
        working-directory: apps/cutlab
        run: |
          flutter pub get
          if [ -f android/gradlew ]; then
            for attempt in 1 2 3 4 5; do (cd android && sh ./gradlew --version) && break; echo "Gradle download failed, retrying"; sleep 30; done
          fi
          # Gradle downloads occasionally fail with HTTP 5xx: retry.
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 --build-name "$BUILD_NAME" --build-number "${{ github.run_number }}" && break
            [ $attempt -lt 3 ] || exit 1
            echo "build failed (attempt $attempt), retrying in 30 s"; sleep 30
          done
          cp build/app/outputs/flutter-apk/app-release.apk CUTLAB.apk
      - name: Check the engine is inside the APK
        working-directory: apps/cutlab
        run: unzip -l CUTLAB.apk | grep -E "lib/arm64-v8a/(libcutlab_core|libapp|libflutter)\.so"; unzip -l CUTLAB.apk | grep -q "lib/arm64-v8a/libcutlab_core.so"
      - uses: actions/upload-artifact@v4
        with:
          name: cutlab-android
          path: apps/cutlab/CUTLAB.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cutlab-android-symbols
          path: symbols
          retention-days: 90

  windows:
    name: Windows x64 (with media engine)
    # Pinned: Flutter 3.24 detects Visual Studio 2019/2022 only, and newer
    # windows-latest images ship a later Visual Studio.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch FFmpeg (LGPL, shared)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ffmpeg/fetch_ffmpeg_windows.ps1 -Dest build/ffmpeg-win64
      - name: Build media engine (cutlab_core.dll)
        run: |
          cmake -S core -B build/core -DCUTLAB_WITH_MEDIA=ON -DCUTLAB_FFMPEG_SHARED=ON -DCUTLAB_FFMPEG_ROOT=${{ github.workspace }}/build/ffmpeg-win64 -DCUTLAB_BUILD_TESTS=OFF
          cmake --build build/core --config Release
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        working-directory: apps/cutlab
        run: |
          flutter create --platforms=windows --org "${{ env.FLUTTER_ORG }}" --project-name cutlab .
          flutter pub get
          flutter build windows --release --build-name "${{ env.BUILD_NAME }}" --build-number "${{ github.run_number }}"
      - name: Add the engine and FFmpeg DLLs, then package
        shell: pwsh
        working-directory: apps/cutlab
        run: |
          $out = "build/windows/x64/runner/Release"
          Copy-Item "${{ github.workspace }}/build/core/Release/cutlab_core.dll" $out
          Get-ChildItem "${{ github.workspace }}/build/ffmpeg-win64/bin" -Filter *.dll | Copy-Item -Destination $out
          Get-ChildItem $out -Filter *.dll | ForEach-Object { Write-Host $_.Name }
          Compress-Archive -Path "$out/*" -DestinationPath CUTLAB-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cutlab-windows-x64
          path: apps/cutlab/CUTLAB-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux x64 (with media engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev nasm zlib1g-dev
      - id: ffcache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-linux
          key: ffmpeg-codecs-linux-x64-${{ hashFiles('scripts/ffmpeg/build_ffmpeg.sh', 'scripts/ffmpeg/build_codecs.sh') }}
      - name: Build encoder libraries + FFmpeg (static, LGPL)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          WORK=$PWD/build/codecs scripts/ffmpeg/build_codecs.sh linux-x64 build/ffmpeg-linux
          CODECS_PREFIX=$PWD/build/ffmpeg-linux WORK=$PWD/build/ffwork scripts/ffmpeg/build_ffmpeg.sh linux-x64 build/ffmpeg-linux
      - name: Build media engine
        run: |
          cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release -DCUTLAB_WITH_MEDIA=ON -DCUTLAB_FFMPEG_ROOT=$PWD/build/ffmpeg-linux -DCUTLAB_BUILD_TESTS=OFF
          cmake --build build/core -j 4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build app
        working-directory: apps/cutlab
        run: |
          flutter create --platforms=linux --org "$FLUTTER_ORG" --project-name cutlab .
          flutter pub get
          flutter build linux --release --build-name "$BUILD_NAME" --build-number "${{ github.run_number }}"
          cp "$GITHUB_WORKSPACE/build/core/libcutlab_core.so" build/linux/x64/release/bundle/lib/
          tar -C build/linux/x64/release/bundle -czf CUTLAB-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cutlab-linux-x64
          path: apps/cutlab/CUTLAB-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish a new release
    needs: [android, windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cutlab-*-x64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: cutlab-android
          path: dist
      - name: Publish as a new release (earlier builds are kept)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Every build gets its own permanent pre-release "cutlab-<version>".
          # Nothing is deleted or replaced: older builds (including the
          # "dev" release, which holds 0.4.20) stay downloadable.
          ls -la dist
          TAG="cutlab-${BUILD_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already exists: not touching it"; exit 0; fi
          cat > notes.md <<EOF
          Development build **${BUILD_NAME}** from commit ${GITHUB_SHA::7}. Earlier builds stay available on the Releases page.

          - **Android:** download \`CUTLAB.apk\` on the phone and install it. Newer builds install over older ones and keep your projects.
          - **Windows:** unzip \`CUTLAB-windows-x64.zip\` and run \`cutlab.exe\`.
          - **Linux:** extract \`CUTLAB-linux-x64.tar.gz\` and run \`./cutlab\`.
          EOF
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --title "CUTLAB ${BUILD_NAME}" --notes-file notes.md
