name: CI

# Code quality, analysis and unit tests for every part of the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  repo-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No large or generated binaries committed
        run: |
          # Fail on any tracked file over 5 MB or on build outputs.
          big=$(git ls-files -z | xargs -0 -I{} sh -c 'test $(wc -c < "{}") -gt 5242880 && echo "{}"' || true)
          if [ -n "$big" ]; then echo "Files over 5 MB:"; echo "$big"; exit 1; fi
          bad=$(git ls-files | grep -E '\.(apk|aab|exe|dmg|AppImage|so|dll|dylib|mp4|mov|mkv)$' || true)
          if [ -n "$bad" ]; then echo "Generated binaries or media must not be committed:"; echo "$bad"; exit 1; fi
      - name: Workflow YAML parses
        run: |
          for f in .github/workflows/*.yml; do python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "ok $f"; done

  web-lite:
    name: CutLab Lite (web) checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/sw.js
      - name: Manifest and assets
        run: |
          node -e "JSON.parse(require('fs').readFileSync('apps/web/manifest.webmanifest','utf8')); console.log('manifest ok')"
          for f in index.html style.css app.js sw.js icon-192.png icon-512.png icon-maskable.png; do test -f "apps/web/$f" || { echo "missing apps/web/$f"; exit 1; }; done

  test-media:
    name: Engine test media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: build/test-media
          key: test-media-${{ hashFiles('scripts/make_test_media.sh') }}
      - name: Generate
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          scripts/make_test_media.sh build/test-media
      - uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: build/test-media
          retention-days: 3

  core-linux:
    name: C++ core + media engine (Linux)
    needs: test-media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: build/test-media
      - id: ffcache
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-linux
          key: ffmpeg-codecs-linux-x64-${{ hashFiles('scripts/ffmpeg/build_ffmpeg.sh', 'scripts/ffmpeg/build_codecs.sh') }}
      - name: Build encoder libraries + FFmpeg (static, LGPL)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y nasm zlib1g-dev ninja-build
          WORK=$PWD/build/codecs scripts/ffmpeg/build_codecs.sh linux-x64 build/ffmpeg-linux
          CODECS_PREFIX=$PWD/build/ffmpeg-linux WORK=$PWD/build/ffwork scripts/ffmpeg/build_ffmpeg.sh linux-x64 build/ffmpeg-linux
      - name: Configure
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release -DCUTLAB_WARNINGS_AS_ERRORS=ON -DCUTLAB_WITH_MEDIA=ON -DCUTLAB_FFMPEG_ROOT=$PWD/build/ffmpeg-linux
      - name: Build
        run: cmake --build build/core --config Release -j 4
      - name: Test
        env:
          CUTLAB_TEST_MEDIA: ${{ github.workspace }}/build/test-media
          CUTLAB_TEST_OUT: ${{ runner.temp }}/export-out
        run: |
          mkdir -p "$CUTLAB_TEST_OUT"
          ctest --test-dir build/core -C Release --output-on-failure -V
      - name: Export a 2-hour recording
        env:
          CUTLAB_TEST_MEDIA: ${{ github.workspace }}/build/test-media
          CUTLAB_TEST_OUT: ${{ runner.temp }}/export-out
        run: build/core/cutlab_export_tests --long-only
      - name: Check every exported file independently (ffprobe, full decode)
        run: |
          sudo apt-get install -y ffmpeg
          python3 scripts/verify_exports.py "${{ runner.temp }}/export-out"
      - id: realmedia
        uses: actions/cache@v4
        with:
          path: build/android-media
          key: android-media-only-${{ hashFiles('scripts/make_android_test_media.sh') }}
      - name: Real-size test media (1080p/4K, H.264/HEVC, portrait, long)
        if: steps.realmedia.outputs.cache-hit != 'true'
        run: sudo apt-get install -y ffmpeg && scripts/make_android_test_media.sh build/android-media
      - name: Preview stress test (players + timeline frames + thumbnails at once)
        run: |
          M=build/android-media
          build/core/cutlab_stress_preview 5 $M/h264_1080p30.mp4 $M/h264_1080p60.mp4 $M/hevc_1080p60.mp4 $M/hevc10_4k30.mp4 \
            $M/phone_portrait_1080p60.mp4 $M/long_720p30_10min.mp4 $M/vfr.mkv $M/tone.mp3 $M/red.png

      - name: Valgrind (uninitialised memory, invalid frees, leaks)
        run: |
          sudo apt-get install -y valgrind
          # Without zero-initialised locals, so valgrind still sees mistakes.
          cmake -S core -B build/core-vg -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCUTLAB_ZERO_INIT_LOCALS=OFF -DCUTLAB_WITH_MEDIA=ON \
            -DCUTLAB_FFMPEG_ROOT=$PWD/build/ffmpeg-linux
          cmake --build build/core-vg -j 4 --target cutlab_stress_preview cutlab_timeline_tests cutlab_export_tests
          M=build/android-media; T=build/test-media
          VG="valgrind --error-exitcode=9 --track-origins=yes --leak-check=full --errors-for-leak-kinds=definite,indirect"
          $VG build/core-vg/cutlab_stress_preview 1 $T/gray60.mp4 $T/rotated.mp4 $T/hevc10.mp4 $T/tone.mp3 $T/red.png $M/hevc_1080p60.mp4 $M/vfr.mkv
          CUTLAB_UNDER_VALGRIND=1 CUTLAB_TEST_MEDIA=$PWD/$T $VG build/core-vg/cutlab_timeline_tests
          mkdir -p "${{ runner.temp }}/vg-out"
          CUTLAB_TEST_MEDIA=$PWD/$T CUTLAB_TEST_OUT="${{ runner.temp }}/vg-out" $VG build/core-vg/cutlab_export_tests --quick
      - name: Timeline benchmark (Linux)
        run: build/core/cutlab_bench_timeline build/test-media build/android-media
      - name: Export benchmark (Linux, software encoders)
        env:
          CUTLAB_TEST_MEDIA: ${{ github.workspace }}/build/test-media
          CUTLAB_TEST_OUT: ${{ runner.temp }}/bench-out
        run: |
          mkdir -p "$CUTLAB_TEST_OUT"
          build/core/cutlab_export_tests --bench build/android-media 2>/dev/null

  core-windows:
    name: C++ core + media engine (Windows x64)
    needs: test-media
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: build/test-media
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch FFmpeg (LGPL, shared)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ffmpeg/fetch_ffmpeg_windows.ps1 -Dest build/ffmpeg-win64
      - name: Configure
        run: cmake -S core -B build/core -DCUTLAB_WITH_MEDIA=ON -DCUTLAB_FFMPEG_SHARED=ON -DCUTLAB_FFMPEG_ROOT=${{ github.workspace }}/build/ffmpeg-win64
      - name: Build
        run: cmake --build build/core --config Release
      - name: Test
        shell: pwsh
        env:
          CUTLAB_TEST_MEDIA: ${{ github.workspace }}/build/test-media
          CUTLAB_TEST_OUT: ${{ runner.temp }}\export-out
        run: |
          New-Item -ItemType Directory -Force -Path $env:CUTLAB_TEST_OUT | Out-Null
          $env:PATH = "${{ github.workspace }}\build\ffmpeg-win64\bin;$env:PATH"
          ctest --test-dir build/core -C Release --output-on-failure -V
      - name: Check every exported file independently (ffprobe, full decode)
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}\build\ffmpeg-win64\bin"
          python scripts/verify_exports.py "${{ runner.temp }}\export-out" "$bin\ffprobe.exe" "$bin\ffmpeg.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preview stress test (players + timeline frames + thumbnails at once)
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\ffmpeg-win64\bin;$env:PATH"
          $m = "${{ github.workspace }}/build/test-media"
          build/core/Release/cutlab_stress_preview.exe 4 "$m/gray60.mp4" "$m/rotated.mp4" "$m/hevc10.mp4" "$m/vfr.mkv" "$m/tone.mp3" "$m/red.png"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-app:
    name: Windows app — timeline playback (integration)
    needs: test-media
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: build/test-media
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Fetch FFmpeg (LGPL, shared)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ffmpeg/fetch_ffmpeg_windows.ps1 -Dest build/ffmpeg-win64
      - name: Build media engine (cutlab_core.dll)
        run: |
          cmake -S core -B build/core -DCUTLAB_WITH_MEDIA=ON -DCUTLAB_FFMPEG_SHARED=ON -DCUTLAB_FFMPEG_ROOT=${{ github.workspace }}/build/ffmpeg-win64
          cmake --build build/core --config Release
      - name: Timeline benchmark (Windows)
        shell: pwsh
        run: |
          $env:PATH = "${{ github.workspace }}\build\ffmpeg-win64\bin;$env:PATH"
          build/core/Release/cutlab_bench_timeline.exe "${{ github.workspace }}/build/test-media"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Run the app's timeline playback test on Windows
        shell: pwsh
        working-directory: apps/cutlab
        run: |
          flutter create --platforms=windows --org com.lunaxoxone.studio --project-name cutlab .
          flutter pub get
          # The engine and FFmpeg DLLs are found through PATH.
          $env:PATH = "${{ github.workspace }}\build\core\Release;${{ github.workspace }}\build\ffmpeg-win64\bin;$env:PATH"
          $env:CUTLAB_TEST_MEDIA = "${{ github.workspace }}\build\test-media"
          flutter test integration_test/timeline_playback_test.dart -d windows --reporter expanded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  dart-packages:
    name: Dart package — project_format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/project_format
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Format check
        run: dart format --output=none --set-exit-if-changed --line-length 140 .

  flutter-app:
    name: Flutter app — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cutlab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Format check
        run: dart format --output=none --set-exit-if-changed --line-length 140 lib test
